# Builds static Storybook, serves it locally, runs @storybook/test-runner + axe on all non-skipped stories.
name: Storybook a11y

on:
  push:
    branches: [main, master]
  pull_request:
  # Dispatched by Visual regression after it commits refreshed baselines, so the
  # bot's commit gets its required checks (decision 0020).
  workflow_dispatch:

jobs:
  storybook-test-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium) for test-runner
        run: npx playwright install chromium --with-deps

      - name: Glyph audit (no character may fall back to a system font)
        run: npm run audit:glyphs

      - name: Build static Storybook + run test-runner
        run: npm run test-storybook:ci
