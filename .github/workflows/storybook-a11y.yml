# Builds static Storybook, serves it locally, runs @storybook/test-runner + axe on all non-skipped stories.
name: Storybook a11y

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  storybook-test-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium) for test-runner
        run: npx playwright install chromium --with-deps

      - name: Glyph audit (no character may fall back to a system font)
        run: npm run audit:glyphs

      - name: Build static Storybook + run test-runner
        run: npm run test-storybook:ci
