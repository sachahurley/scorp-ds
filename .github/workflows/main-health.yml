# Keeps one GitHub issue honest about the state of main: opened (or commented
# on) when a check on main fails, closed when everything is green again. You
# only hear about main when it is broken. See docs/decisions/0019.
#
# Report only: this workflow never pushes, never edits code, and needs no
# secrets beyond the default token.
#
# Two ways in:
# - Whenever CI, Storybook a11y or Deploy Storybook finishes on main.
# - Weekly, and by hand: the full ds-health.sh plus an npm audit report, which
#   catch what a push cannot (a dependency advisory published since the last
#   merge). The audit is reported in the run summary and does not open the
#   issue until decision 0018's gate is in place.
name: main health

on:
  workflow_run:
    workflows: [CI, Storybook a11y, Deploy Storybook]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

# Queue rather than race: two workflows failing together must not open two issues.
concurrency:
  group: main-health
  cancel-in-progress: false

env:
  ISSUE_TITLE: main health check is failing
  WATCHED: CI|Storybook a11y|Deploy Storybook

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'workflow_run'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'workflow_run'
        run: npm ci

      - name: Full health check
        id: health
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/ds-health.sh 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | tee health.txt

      - name: Dependency audit (report only)
        if: github.event_name != 'workflow_run'
        run: |
          {
            echo '### npm audit'
            echo
            echo '```'
            npm audit --omit=dev 2>&1 | tail -n 4 || true
            echo
            echo '(including dev dependencies)'
            npm audit 2>&1 | grep -E 'vulnerabilities' || echo 'no vulnerabilities'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH: ${{ steps.health.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures=""

          # The latest completed run on main of each watched workflow. Looking at
          # all of them, not just the one that triggered this run, is what lets a
          # green CI close the issue only when a11y and deploy are green too.
          IFS='|' read -ra watched <<< "$WATCHED"
          for wf in "${watched[@]}"; do
            line=$(gh run list --workflow "$wf" --branch main --status completed --limit 1 \
                     --json conclusion,url,displayTitle \
                     --jq '.[0] | select(. != null) | [.conclusion, .url, .displayTitle] | @tsv')
            [ -z "$line" ] && continue
            IFS=$'\t' read -r conclusion url title <<< "$line"
            case "$conclusion" in
              success|skipped|cancelled) ;;
              *) failures+="- **$wf**: $conclusion on \"$title\" ($url)"$'\n' ;;
            esac
          done

          if [ "$HEALTH" = "failure" ]; then
            failures+="- **ds-health.sh**: failed ($RUN_URL)"$'\n'
          fi

          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
                     --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)

          if [ -n "$failures" ]; then
            body=$(printf 'Checked %s.\n\n%s' "$(date -u +'%F %H:%M UTC')" "$failures")
            if [ -f health.txt ] && [ "$HEALTH" = "failure" ]; then
              body+=$(printf '\n<details><summary>ds-health.sh output</summary>\n\n```\n%s\n```\n</details>\n' "$(tail -n 60 health.txt)")
            fi
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            fi
            echo "$failures" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Everything on main is green again ($(date -u +%F))."
            echo "All green; closed #$number." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All green." >> "$GITHUB_STEP_SUMMARY"
          fi
