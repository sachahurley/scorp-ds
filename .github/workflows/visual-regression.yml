# Screenshots every story in both themes and diffs against committed baselines.
#
# Baselines are platform-specific: font rasterisation differs between macOS and
# Linux, so a baseline captured on a laptop will never match here. They are
# generated and compared ONLY in this container.
#
# Two ways to refresh them (decision 0020):
# - Put [update-baselines] in the message of a pull request's latest commit.
#   This job then rewrites the frames that changed, commits them to the branch,
#   and re-runs the required checks on that commit. Review the PNGs in the
#   pull request's "Files changed" tab; GitHub shows before and after.
# - Run this workflow by hand with `update` (and `force` for a Chromium or
#   runner upgrade). That uploads the baselines as an artifact to commit by
#   hand, which is the only route for a branch with no pull request.
name: Visual regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: 'Rewrite the baselines instead of comparing against them'
        type: boolean
        default: false
      force:
        description: 'With update: rewrite every baseline, including frames that did not change. For a browser or runner upgrade.'
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # write: only for a refresh, to push the new baselines and dispatch the
    # checks. A pull request from a fork gets a read-only token regardless,
    # and the refresh step skips it.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Is this a baseline refresh?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          refresh=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$SAME_REPO" = "true" ]; then
            message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.message)
            case "$message" in *"[update-baselines]"*) refresh=true ;; esac
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "Baseline refresh: $refresh"

      # A refresh renders the branch itself, not the merge with main that a
      # pull_request run checks out by default, so the baselines it commits
      # are the branch's own frames.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.refresh == 'true' && github.head_ref || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Build static Storybook
        run: npm run build-storybook --workspace=@scorp-ds/storybook

      - name: Compare against baselines
        if: ${{ github.event.inputs.update != 'true' && steps.mode.outputs.refresh != 'true' }}
        run: node scripts/visual-regression.mjs

      - name: Upload diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: packages/storybook/visual-diffs/
          if-no-files-found: ignore

      # An update run rewrites only the frames that actually changed, so the
      # commit that follows contains those frames and nothing else. `force`
      # rewrites all of them, which is what a Chromium or runner upgrade needs.
      - name: Rewrite baselines
        if: ${{ github.event.inputs.update == 'true' }}
        run: node scripts/visual-regression.mjs --update ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Upload new baselines
        if: ${{ github.event.inputs.update == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: packages/storybook/visual-baselines/

      # [update-baselines]: rewrite what changed, commit it to the branch, then
      # run the required checks on the new commit. A push made with the default
      # token starts no workflows, which would leave the pull request waiting on
      # checks that never report; a workflow_dispatch is the one event that
      # token is allowed to start. Aura DS's goldens bot skipped this step and
      # needed a hand-made empty commit after every refresh.
      - name: Refresh baselines and commit them
        if: ${{ steps.mode.outputs.refresh == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/visual-regression.mjs --update
          git add packages/storybook/visual-baselines
          if git diff --cached --quiet; then
            echo "Every frame already matches its baseline; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh $changed visual baseline(s) on Linux" \
            -m "Written by the Visual regression workflow on request from the commit before this one. Review the images before merging."
          git push origin "HEAD:$BRANCH"
          for workflow in ci.yml storybook-a11y.yml visual-regression.yml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
          {
            echo "Committed $changed baseline(s) to \`$BRANCH\` and re-ran the required checks on it:"
            echo
            git show --name-only --format= HEAD | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
