# Screenshots every story in both themes and diffs against committed baselines.
#
# Baselines are platform-specific: font rasterisation differs between macOS and
# Linux, so a baseline captured on a laptop will never match here. They are
# generated and compared ONLY in this container. To (re)create them, run this
# workflow manually with `update` set to true and commit the result.
name: Visual regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: 'Rewrite the baselines instead of comparing against them'
        type: boolean
        default: false
      force:
        description: 'With update: rewrite every baseline, including frames that did not change. For a browser or runner upgrade.'
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Build static Storybook
        run: npm run build-storybook --workspace=@scorp-ds/storybook

      - name: Compare against baselines
        if: ${{ github.event.inputs.update != 'true' }}
        run: node scripts/visual-regression.mjs

      - name: Upload diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: packages/storybook/visual-diffs/
          if-no-files-found: ignore

      # An update run rewrites only the frames that actually changed, so the
      # commit that follows contains those frames and nothing else. `force`
      # rewrites all of them, which is what a Chromium or runner upgrade needs.
      - name: Rewrite baselines
        if: ${{ github.event.inputs.update == 'true' }}
        run: node scripts/visual-regression.mjs --update ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Upload new baselines
        if: ${{ github.event.inputs.update == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: packages/storybook/visual-baselines/
