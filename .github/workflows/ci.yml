# Fast correctness gate: lint, types and unit tests on every PR.
# Kept separate from storybook-a11y.yml so it fails in ~1 minute instead of
# waiting on a full static Storybook build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Dispatched by Visual regression after it commits refreshed baselines, so the
  # bot's commit gets its required checks (decision 0020).
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # packages/site imports @scorp-ds/components by package name, so it only
      # type-checks against the built dist. Without this, type-check fails on a
      # clean clone with "Cannot find module '@scorp-ds/components'".
      - name: Build components (required for type-check)
        run: npm run build:components

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      # Fails if a component's public API changed without the generated manifest
      # being regenerated. The manifest is what spec-drift detection compares
      # against, so a stale one silently disables that check.
      - name: API surface manifest is current
        run: node scripts/generate-api-surface.mjs --check

      # Runs after the manifest check on purpose: it compares each spec's
      # recorded API hash against the manifest, which is only meaningful once
      # the manifest is known to be current. See docs/decisions/0016.
      - name: Specs match the components they describe
        run: bash scripts/detect-spec-drift.sh

      # The catalog is generated from the manifest and the specs, so it can only
      # be stale if someone forgot to regenerate it after changing either.
      - name: Component catalog is current
        run: node scripts/generate-catalog.mjs --check
