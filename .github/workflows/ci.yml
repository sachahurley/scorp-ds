# Fast correctness gate: lint, types and unit tests on every PR.
# Kept separate from storybook-a11y.yml so it fails in ~1 minute instead of
# waiting on a full static Storybook build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Dispatched by Visual regression after it commits refreshed baselines, so the
  # bot's commit gets its required checks (decision 0020).
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # packages/site imports @scorp-ds/components by package name, so it only
      # type-checks against the built dist. Without this, type-check fails on a
      # clean clone with "Cannot find module '@scorp-ds/components'".
      - name: Build components (required for type-check)
        run: npm run build:components

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      # Fails if a component's public API changed without the generated manifest
      # being regenerated. The manifest is what spec-drift detection compares
      # against, so a stale one silently disables that check.
      - name: API surface manifest is current
        run: node scripts/generate-api-surface.mjs --check
